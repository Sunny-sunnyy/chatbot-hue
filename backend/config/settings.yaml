  ban_do_lich: true              # bản đồ lịch trình (plan 2026-11-08 bản 1 `e738f6f9f3ae`): ghim có số theo thứ tự trong ngày, toạ độ do code gắn; bật ⇒ CSP img-src thêm data: + host ô bản đồ ở `BAN_DO` (`api/routes/cong.py`; nay OSM Đức — Leaflet huỷ tile bằng GIF data:). BẬT 16/11 tối (User chọn bật cho lượt thử; tắt lại = đổi dòng này)
