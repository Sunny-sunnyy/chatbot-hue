# Hue full-corpus RAG settings

full_corpus:
  knowledge_base:
    root_dir: ../knowledge-base-hue
    include_globs:
      - foods/**/*.md
      - heritages/**/*.md
      - festivals/**/*.md
      - performing_arts/**/*.md
      - travel/places/**/*.md
      - travel/services/**/*.md
      - travel/tickets/**/*.md
    exclude_parts:
      - evaluation
      - _source-dumps
      - meta
    exclude_files:
      - travel/services/services-research-and-entities-inventory.md
      - travel/tickets/tickets-research-and-entities-inventory.md
      - performing_arts/performing-arts-entities-inventory.md
  conditions_file: ../knowledge-base-hue/meta/full_corpus_conditions.json
  embedding_models:
    - id: intfloat/multilingual-e5-small
      max_tokens: 512
      prefix: "passage: "
      word_segment: false
    - id: intfloat/multilingual-e5-base
      max_tokens: 512
      prefix: "passage: "
      word_segment: false
    - id: CODE4LIFEOFFICIAL/huydang-dek21-embedding
      max_tokens: 256
      prefix: ""
      word_segment: true

vector_database:
  url: http://localhost:6335
  timeout: 30

full_corpus_runtime:
  candidate_id: e5-small-384
  retrieval_treatment: dense_bm25_rrf
  reranker: none

full_corpus_generation:
  provider: openai
  model: gpt-6-luna
  api_key_env: OPENAI_API_KEY
  token_encoding: o200k_base
  answer_max_output_tokens: 2048
  timeout_seconds: 45
  context_limit: 16384
  reserved_output_tokens: 2048
  safety_margin: 512
  max_context_documents: 10

# Phase 9 B1 (plan docs/superpowers/plans/2026-11-02-phase-9-b1-plan.md D9): mỗi phần một cờ, gỡ độc lập; tắt cả 4 ⇒ chuỗi gửi model như B0.
assistant:
  emergency_rule: false          # TẮT (B1 P3 kín: bắt 0 / 8, chặn nhầm 2 / 8). Luật code nhận câu khẩn cấp ⇒ câu soạn sẵn, không gọi model (D1, D2)
  router: true                   # BẬT (B1 P1). Định tuyến 4 tuyến bằng model (D3); tắt ⇒ mọi câu tro_ly_hue
  today_line: false              # TẮT (B1 P2: từ chối nhầm không giảm). Dòng ngày hôm nay đầu tin nhắn gửi model trả lời (D7)
  may_have_changed_notice: true  # BẬT (B1). Dòng H4c dưới câu trả lời có nguồn vé / điểm đến / lễ hội (D8)
  router_timeout_seconds: 10
  song_song_tra_loi: true         # BẬT (User duyệt 05/11; #6 đạt: chữ đầu câu về Huế −1,37 s [0,34; 2,14], an toàn 90 lượt 0 vi phạm): đường stream chạy phần tro_ly_hue cùng lúc định tuyến
  lan_tim_dau: v0                # B2 (plan D1): v0 câu gốc · v1 / v3 câu tìm do định tuyến viết · v2 trợ lý tự gọi tim_kho
  tim_them: true                 # BẬT (B2b Q8: 18 câu nhiều nguồn +1,17 [+0,44; +2,00]; User giữ 03/11). Sau lần tìm đầu, trợ lý được gọi tim_kho thêm ≤ 2 lần
  nho_hoi_thoai: true            # BẬT (B3b: đã thấy Q3 6/6, Q4 +0,80 [+0,25; +1,50], Q5 0/0; bộ mới C152 S1 0/6, S2 0/19 ↔ 5/19; A quyết theo User "đạt ⇒ bật")
  nho_cau_tra_loi: false         # B3b (B138, A quyết (a) — đường kết quả âm ghi trước): chỉ nhớ câu hỏi; B3: true
  lich_trinh: false              # B5 (plan bản 7 D1): công cụ lịch trình (code xếp + code tự hỏi số ngày) — TẮT tới khi đạt luật ghi trước. Công cụ `hoi_lai` của B4 đã gỡ (C183 m-2)
  lich_trinh_bang: ../data/phase_9/lich_trinh/diem_v3.json  # bảng điểm User duyệt (v3 `e94b7f4263f2`, private); chỉ nạp khi cờ bật
  lich_trinh_bieu_mau: true      # cổng đợt 1 (spec D3 / D4): lượt từ biểu mẫu "Lên kế hoạch" — code xếp bằng giá trị nút, sinh không công cụ (V5: luật lịch trong lời dặn + suy luận low). BẬT 07/11/2026 (User; S3 Q-F bộ quyết đạt 24/24, F-a 12/12 ×2)
  tra_web: true                  # B6 (plan B6 bản 3 D10): cổng web (Serper) sau câu từ chối của kho — BẬT 05/11/2026 tối (đạt luật ghi trước + kín ×2 + review; User duyệt); cần router + tim_them
  tra_web_timeout_seconds: 5     # B6 D3: một lần gọi Serper, không thử lại
  thoi_tiet: true                # B5b (plan B5b bản 2 D11): dự báo Huế (Open-Meteo) + dòng dự báo trong lịch — BẬT 07/11/2026 (User Q-U4 spec cổng đợt 1: bật khi merge đợt 1; B5b đạt luật ghi trước); cần tim_them

# Phase 10 A1 (plan `2026-11-05-phase-10-a1-plan.md` bản 2 D2): hỏi bằng ảnh — `POST /api/anh/ung_vien`. TẮT tới khi đạt A2 (spec Phase 10 §5).
# Tắt ⇒ route trả 404, không nạp danh sách. Đường dẫn tính từ `backend/`.
anh:
  bat: false
  danh_sach: ../data/phase_10/anh/danh_sach_ten.json   # do code dựng (`data/phase_10/anh/tools/dung_danh_sach.py`), User duyệt
  max_bytes: 10485760        # 10 MB — chặn trước khi đọc thân (spec A10 (3))
  max_pixels: 40000000       # chặn ảnh "bom giải nén" trước khi giải mã (spec §6)
  canh_dai: 1024             # thu nhỏ trước khi gửi model (spec A5)
  timeout: 20                # giây, một lần gọi model (A2: 1024 token ra có thể > 15 s); quá ⇒ khong_doan_duoc, không thử lại
