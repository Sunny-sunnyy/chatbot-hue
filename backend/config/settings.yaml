  tach_cau_tim_model: true       # MỞ 14:33 22/11/2026 (đạt tiêu chí ghi trước của lượt ba bên): câu tìm do model viết gộp nhiều nơi / nhiều ý ⇒ mỗi phần được tìm riêng, 2 đoạn đầu nối thêm sau kết quả của cả câu (cơ chế của tim_theo_ve). Tin 4 ý: đoạn giá vé lẻ Đại Nội vào ngữ cảnh 2 / 6 ⇒ 6 / 6; kết quả mỗi lần tìm dài thêm khoảng 2 đoạn
