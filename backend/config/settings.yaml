  lich_trinh_bang_anh: ../data/phase_9/lich_trinh/bang_anh_v1.json  # bảng ảnh C (24 / 34 điểm, md5 a5e210e5a1f0; private); chỉ nạp khi anh_lich bật — ảnh ở frontend/public/anh/lich/
