# Hue Foods RAG MVP settings
active_profile: dense_only

# Retrieval profiles. Change active_profile above to switch behavior.
profiles:
  dense_only:
    retrieval_mode: dense
    use_bm25: false
    use_reranker: false
  hybrid_no_rerank:
    retrieval_mode: hybrid
    use_bm25: true
    use_reranker: false
  hybrid_rerank:
    retrieval_mode: hybrid
    use_bm25: true
    use_reranker: true

knowledge_base:
  root_dir: ../knowledge-base-hue
  include_globs:
    - foods/**/*.md
    - foods/food-guides.md
  exclude_parts:
    - evaluation
    - _source-dumps
    - meta

embedding:
  provider: sentence_transformer
  model: intfloat/multilingual-e5-small
  vector_size: 384
  device: cpu
  batch_size: 64

vector_database:
  url: http://localhost:6333
  collection_name: hue_foods_rag
  reset_collection: true
  vector_size: 384
  distance: cosine
  # Warning: changing embedding.model or embedding.vector_size requires
  # reindexing. Keep vector_database.vector_size in sync with embedding.vector_size
  # and set reset_collection: true before re-running ingestion.

retrieval:
  top_k: 10
  candidate_multiplier: 3
  score_threshold: 0.0
  dense_weight: 0.6
  bm25_weight: 0.4

reranking:
  model: cross-encoder/ms-marco-MiniLM-L-6-v2
  device: cpu
  top_k: 5

llm:
  provider: openai
  answer_model: gpt-5.4-nano
  temperature: 0.2
  max_output_tokens: 1024
  # Model IDs must be verified against official OpenAI docs before Phase 6
  # implementation or execution.

evaluation:
  test_file: ../knowledge-base-hue/foods/evaluation/tests.jsonl
  judge_model: gpt-5.4-mini
