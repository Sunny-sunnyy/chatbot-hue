# Hue full-corpus RAG settings

full_corpus:
  knowledge_base:
    root_dir: ../knowledge-base-hue
    include_globs:
      - foods/**/*.md
      - heritages/**/*.md
      - festivals/**/*.md
      - performing_arts/**/*.md
      - travel/places/**/*.md
      - travel/services/**/*.md
      - travel/tickets/**/*.md
    exclude_parts:
      - evaluation
      - _source-dumps
      - meta
    exclude_files:
      - travel/services/services-research-and-entities-inventory.md
      - travel/tickets/tickets-research-and-entities-inventory.md
      - performing_arts/performing-arts-entities-inventory.md
  conditions_file: ../knowledge-base-hue/meta/full_corpus_conditions.json
  embedding_models:
    - id: intfloat/multilingual-e5-small
      max_tokens: 512
      prefix: "passage: "
      word_segment: false
    - id: intfloat/multilingual-e5-base
      max_tokens: 512
      prefix: "passage: "
      word_segment: false
    - id: CODE4LIFEOFFICIAL/huydang-dek21-embedding
      max_tokens: 256
      prefix: ""
      word_segment: true

vector_database:
  url: http://localhost:6335
  timeout: 30

full_corpus_runtime:
  candidate_id: e5-small-384
  retrieval_treatment: dense_bm25_rrf
  reranker: none

full_corpus_generation:
  provider: bedrock              # openai | bedrock — ĐỔI QUA / ĐỔI VỀ model viết chỉ sửa dòng này. `bedrock` = Claude trên Amazon Bedrock theo khối `bedrock` dưới (đổi TẠM, User 21/11/2026); người chấm của bộ đo luôn là `model` dưới
  model: gpt-6-luna
  api_key_env: OPENAI_API_KEY
  token_encoding: o200k_base
  timeout_seconds: 45
  max_context_documents: 10
  bedrock:                       # chỉ đọc khi provider: bedrock (lớp dịch `backend/llm/bedrock_model.py`)
    model: global.anthropic.claude-sonnet-5-5
    region: ap-southeast-1
    max_tokens: 128000           # trường BẮT BUỘC của kiểu gọi Claude ⇒ để mức tối đa của model = coi như không trần (User 21/11/2026); không đặt nhỏ hơn
    sua_lich_timeout_seconds: 10 # hạn giờ RIÊNG của lời gọi hiểu ý sửa lịch trên đường Bedrock (đường OpenAI dùng chung router_timeout_seconds); lâu nhất đã đo ở high 7,1 s
    reasoning_sua_lich: high     # none | low | medium | high — RIÊNG lời gọi hiểu ý sửa lịch (đo 21/11: lệnh khó đúng 5 / 6 ở high, 2 / 6 low, 0 / 6 medium); viết câu lịch + lượt biểu mẫu giữ "low" trong code
    reasoning_default: high      # none | low | medium | high — mức suy luận cho lời gọi KHÔNG tự đặt mức (nhóm lịch tự đặt "low"); đang `high` từ 21/11/2026 (đổi tạm model viết); mức cuối chọn sau lượt đo
    cong_cong_cu: tu_khoa        # tu_khoa | luon — cổng đưa công cụ thời tiết / ngày / khoảng cách khi provider là bedrock (xem `assistant.cong_cong_cu`); đổi sau lượt đo bậc 5
    creds_file_env: HUE_BEDROCK_CREDS_FILE  # TÊN biến môi trường trỏ tới file khoá tạm (JSON) — đường dẫn không ghi vào repo

# Phase 9 B1 (plan docs/superpowers/plans/2026-11-02-phase-9-b1-plan.md D9): mỗi phần một cờ, gỡ độc lập; tắt cả 4 ⇒ chuỗi gửi model như B0.
assistant:
  router: true                   # BẬT (B1 P1). Định tuyến 4 tuyến bằng model (D3); tắt ⇒ mọi câu tro_ly_hue. Phương án B G: khan_cap đi agent Huế (bỏ câu soạn sẵn)
  today_line: false              # TẮT (B1 P2: từ chối nhầm không giảm). Dòng ngày hôm nay đầu tin nhắn gửi model trả lời (D7)
  may_have_changed_notice: true  # BẬT (B1). Dòng H4c dưới câu trả lời có nguồn vé / điểm đến / lễ hội (D8)
  router_timeout_seconds: 10
  so_vong_cong_cu: 5             # trần vòng gốc của lượt trợ lý có công cụ (+1 khi có công cụ ngày, +1 khi có công cụ khoảng cách). 4 ⇒ 5 lúc 14:33 22/11/2026, đi cùng `so_lan_tim_kho` 3 (mỗi lần tìm thêm cần một vòng)
  so_lan_tim_kho: 3              # số lần model được tìm kho thật trong một lượt (lần tìm đầu của code không tính). 2 ⇒ 3 lúc 14:33 22/11/2026: ở tin dài nhiều ý, sau khi bản tách câu tìm đưa giá vé về ngay lần đầu, lần tìm thứ ba tới được ý còn lại — tin 4 ý lặp 6 lần nêu đúng cả hai ý kho-có 1 / 6 ⇒ 6 / 6, +2 giây trung vị; tin thường và tin kho-thiếu không dùng lần thứ ba. Nới KHÔNG kèm bản tách (trưa 22/11) không chữa được gì ⇒ hai thứ đi cùng nhau
  song_song_tra_loi: true         # BẬT (User duyệt 05/11; #6 đạt: chữ đầu câu về Huế −1,37 s [0,34; 2,14], an toàn 90 lượt 0 vi phạm): đường stream chạy phần tro_ly_hue cùng lúc định tuyến
  lan_tim_dau: v0                # B2 (plan D1): v0 câu gốc · v1 / v3 câu tìm do định tuyến viết · v2 trợ lý tự gọi tim_kho
  tim_them: true                 # BẬT (B2b Q8: 18 câu nhiều nguồn +1,17 [+0,44; +2,00]; User giữ 03/11). Sau lần tìm đầu, trợ lý được gọi tim_kho thêm ≤ 2 lần
  nho_hoi_thoai: true            # BẬT (B3b: đã thấy Q3 6/6, Q4 +0,80 [+0,25; +1,50], Q5 0/0; bộ mới C152 S1 0/6, S2 0/19 ↔ 5/19; A quyết theo User "đạt ⇒ bật")
  nho_cau_tra_loi: true          # BẬT 09:40 22/11/2026 (phiên điều phối quyết sau MỘT lượt bốn chuỗi ba lượt trên model đang chạy, bật ↔ tắt cùng buổi — hồ sơ riêng tư `data/thu_bedrock_2026-11-21/do/muc_8/luot_2211/`: câu hỏi tiếp trỏ vào một mục của câu trả lời vừa rồi ("quán thứ hai bạn vừa kể ở đường nào") bên tắt không xác định được, bên bật trả đúng; ba chuỗi còn lại hai bên như nhau; 0 lỗi / 24 lượt; không lượt nào lấy câu trả lời cũ làm nguồn). Lịch sử mang câu trả lời của lượt LIỀN TRƯỚC (bỏ mã trích dẫn, cắt 4.000 ký tự — `api/conversations.CAT_LOI_TRUOC`, có dòng nhãn "không phải nguồn"); lượt có công cụ đổi theo giờ (thời tiết, khoảng cách) không được nhớ; bản nhớ đáp cả ba lượt của 03/11 không còn bật được. Plan `report_agent/2026-11-20/b_nho_cau_tra_loi_plan.md`. Lùi: đổi thành false + khởi động lại
