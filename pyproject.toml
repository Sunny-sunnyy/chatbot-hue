[project]
name = "hue-rag"
version = "0.1.0"
description = "Hue RAG application"
requires-python = ">=3.13"
dependencies = [
    "qdrant-client",
    "sentence-transformers",
    "pyyaml",
    "fastapi>=0.135",
    "uvicorn[standard]>=0.32.0",
    "numpy",
    "openai>=2.48.0",
    "openai-agents>=0.18.3",
    "pyvi==0.1.1",
    "markdown-it-py>=4.0.0,<5.0.0",
    "tiktoken>=0.12,<1",
    "httpx>=0.28.1",
    "sentencepiece>=0.2.2",
    "lunar-vn==1.4.0",
    "python-pptx==1.0.2",
]

[dependency-groups]
dev = [
    "playwright==1.58.*",
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ipykernel",
    "jupyter",
    "gradio>=6.25.0",
    "polars",
    "pyarrow",
    "nltk",
    "beautifulsoup4",
    "scikit-learn",
    "requests",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.12",
]
evaluation = [
    "underthesea>=9.5,<10",
]
